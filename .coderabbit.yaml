# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
reviews:
  # "chill" — меньше нитпиков; поставь "assertive", если хочешь придирчивее.
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  # Что НЕ ревьюить (шум/артефакты). "!" = исключить.
  path_filters:
    - "!**/bun.lock"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"
    - "!**/*.min.js"
  tools:
    # Бесплатные OSS-сканеры, которые CodeRabbit гоняет сам в каждом PR —
    # это и есть «проверки на уязвимости» поверх AI-ревью.
    gitleaks: # утёкшие секреты/токены
      enabled: true
    semgrep: # SAST по community-правилам
      enabled: true
    trivy: # уязвимости в зависимостях + мисконфиги
      enabled: true
    checkov: # IaC/конфиг-мисконфиги (docker-compose и т.п.)
      enabled: true
chat:
  auto_reply: true
