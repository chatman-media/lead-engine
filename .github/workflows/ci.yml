name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем stale runs на том же ref — быстрые pushы не очередят
# три параллельных job'а.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Bun: новая минорная версия не должна сюрпризить runtime поведение.
  # Bump при обновлении @types/bun в любом package.json.
  BUN_VERSION: "1.3.14"

jobs:
  workspace:
    name: workspace — install + typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      # pgvector нужен для будущих integration-тестов DrizzleKbStore
      # (vector(1536) колонка в kb_chunks). Pure-unit suite сейчас не
      # пользуется PG, но сервис стоит — Q (Issue #3) включит.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.github/workflows/ci.yml') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      - name: Typecheck all workspace members (apps/* + packages/*)
        run: bun run --filter '*' typecheck

      - name: Unit + integration tests (all workspace members)
        env:
          # @chatman-media/storage интеграционные тесты apply'ят все
          # migrations 0000–0005 + verify invariants (RLS-enabled таблицы,
          # legacy tenant, outbound status union, pgvector extension,
          # idempotent backfill). Бывший отдельный `migrations` job теперь
          # покрыт здесь.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lead_engine_test
        run: bun run --filter '*' test
