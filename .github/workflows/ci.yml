name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same ref so a fast push doesn't queue 3 jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Bun so a future minor change doesn't surprise us. Keep in lockstep
  # with package.json's @types/bun major.
  BUN_VERSION: "1.3.8"

jobs:
  check:
    name: typecheck + lint + secret-scan + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `contents: write` lets the badge step commit .github/badges/coverage.svg
    # back to main. All other jobs keep the default read-only token.
    permissions:
      contents: write

    services:
      # pgvector image bundles PostgreSQL + the pgvector extension that
      # KbRepo needs for vector search. tests/helpers/test-db.ts applies
      # pg_schema.sql which calls CREATE EXTENSION vector.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgchatbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Tests use fake embedders with an 8-d shape; setupTestDb patches the
      # schema accordingly. activeEmbeddingDim() in src/config.ts must agree
      # so tests that call into it (e.g. kb-management.test.ts) match.
      OPENAI_EMBEDDING_DIM: "8"
      OLLAMA_EMBEDDING_DIM: "8"

    steps:
      - uses: actions/checkout@v4
        with:
          # We use `git ls-files` in scan-secrets.ts; full history isn't
          # required, but workflow context still benefits from a clean clone.
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            admin-ui/node_modules
          # Bust on lockfile or workflow change.
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.github/workflows/ci.yml') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps (incl. workspace admin-ui)
        run: bun install --frozen-lockfile

      - name: typecheck (src + scripts)
        run: bun run typecheck

      - name: biome check
        run: bun run check

      - name: scan-secrets
        run: bun run secret-scan

      - name: unit tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tgchatbot_test
        run: bun test tests/unit

      - name: coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tgchatbot_test
        # Bun 1.3.14's coverageThreshold in bunfig.toml is read but never
        # enforced — so the check-coverage wrapper script parses the text
        # report and exits non-zero below the line/function floors. Baseline
        # at this commit was 90.2% lines / 91.4% funcs (process entrypoints
        # and test-only seed code are excluded via bunfig
        # coveragePathIgnorePatterns). Floors sit at 90% to hold the line.
        run: |
          set -o pipefail
          mkdir -p coverage
          bun test tests/unit --coverage --coverage-reporter=text --coverage-reporter=lcov 2>&1 \
            | bun scripts/check-coverage.ts --line 0.90 --function 0.90 \
            | tee coverage/coverage.txt

      - name: upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: update coverage badge
        # Only on push to main: regenerate the SVG badge from coverage/lcov.info
        # and commit it if the percentage changed. `[skip ci]` prevents the
        # bot commit from triggering another CI run.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bun scripts/coverage-badge.ts
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "coverage badge unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            # checkout@v4 leaves a detached HEAD on push events — push the
            # commit explicitly to main.
            git push origin HEAD:main
          fi

      - name: build admin UI
        # Catch UI-side TS errors and Vite-time issues that don't show up in
        # the source-only typecheck above (admin-ui has its own tsconfig).
        run: bun run build:ui

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E now blocks the merge. Playwright config sets retries=1 in CI
    # to absorb a one-off network/scheduler hiccup without masking real
    # regressions (retried runs are still reported separately).

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgchatbot_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            admin-ui/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.github/workflows/ci.yml') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright (Chromium only)
        run: bun run test:e2e:install

      - name: Build admin UI
        run: bun run build:ui

      - name: Run e2e
        env:
          CI: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tgchatbot_e2e
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
