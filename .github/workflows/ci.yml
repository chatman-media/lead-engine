name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем stale runs на том же ref — быстрые pushы не очередят
# параллельные job'ы. Релиз (push в main) не отменяем — иначе можно
# прервать публикацию на полпути.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin Bun: новая минорная версия не должна сюрпризить runtime поведение.
  # Bump при обновлении @types/bun в любом package.json.
  BUN_VERSION: "1.3.14"

jobs:
  workspace:
    name: workspace — install + typecheck + tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # @chatman-media/storage интеграционные тесты apply'ят все migrations
      # + verify invariants (RLS-таблицы, legacy tenant, outbound status
      # union, pgvector extension, idempotent backfill). Multi-tenant E2E
      # suite в apps/api тоже бьёт по PG.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lead_engine_test

    services:
      # pgvector нужен для integration-тестов DrizzleKbStore
      # (vector(1536) колонка в kb_chunks) и multi-tenant RLS suite.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun + node_modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.github/workflows/ci.yml') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      - name: Typecheck all workspace members (apps/* + packages/*)
        run: bun run --filter '*' typecheck

      # Единый проход: bun test сканирует все *.test.ts в workspace.
      # Фронтенды (admin-ui/landing/widget) не имеют тест-файлов — bun их
      # просто пропускает. widget'овый скрипт "exit 0" не задействован.
      # Единый coverage-map даёт корректные цифры: packages покрываются как
      # своими тестами, так и интеграционными тестами apps/api.
      - name: Tests + coverage (all workspace)
        run: |
          set -o pipefail
          bun test \
            --coverage \
            --coverage-reporter=text \
            --coverage-reporter=lcov 2>&1 | tee coverage.txt

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false # codecov-флейк не должен ронять CI

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Test coverage (per workspace member)'
            echo ''
            echo '```'
            grep 'All files' coverage.txt || echo 'no coverage rows captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
          if-no-files-found: ignore

      # Codecov Bundle Analysis: build the Vite frontends so the codecovVitePlugin
      # uploads bundle stats (size trends per commit/PR). Token-gated — the plugin
      # no-ops without CODECOV_TOKEN, so this is a plain build otherwise.
      - name: Bundle analysis — build frontends (Codecov)
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bun run --filter './apps/admin-ui' --filter './apps/landing' --filter './apps/widget' build

  release:
    name: Release — publish @chatman-media/* to npm
    needs: workspace
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release нужна полная история + теги для анализа
          # commit-range и вычисления next version.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node (semantic-release runtime)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      - name: Skip npm release when token is not configured
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not configured; skipping npm publish release job."

      - name: Configure npm auth for bun publish
        if: env.NPM_TOKEN != ''
        run: |
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > ~/.npmrc
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > .npmrc

      - name: Build all packages (topological)
        if: env.NPM_TOKEN != ''
        # Гарантируем, что dist/*.d.ts каждого пакета существует ДО
        # semantic-release: dependent может выпускаться, даже если его
        # workspace-зависимость в этом прогоне без релиза (и потому её
        # prepublishOnly-build не запустится).
        run: bun run build:packages

      - name: Release each package (dependency order)
        if: env.NPM_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Топологический порядок: пакет публикуется только после своих
          # workspace-зависимостей, чтобы bun publish зарезолвил
          # workspace:* в уже опубликованную версию.
          PACKAGES=(
            observability
            channel-core
            llm-router
            verticals
            storage
            channel-telegram
            channel-web
            channel-whatsapp
            kb
            conversation-engine
            sales
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::semantic-release @chatman-media/$pkg"
            (cd "packages/$pkg" && bunx semantic-release)
            echo "::endgroup::"
          done

  deploy:
    name: Deploy — SSH → сервер → deploy.sh
    needs: workspace
    runs-on: ubuntu-latest
    # Катим только реальный push в main: PR, форки и ручные ветки на прод не идут.
    # needs: workspace — деплоим лишь после зелёных тестов. release не нужен:
    # сервер ставит @chatman-media/* как workspace-зависимости, а не из npm.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    # Деплои строго по одному: in-progress не отменяем — обрыв на середине
    # migrate/build опаснее, чем подождать. Параллельные пуши в main встают в очередь.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # GitHub Environment даёт историю деплоев и точку для будущих protection
    # rules (required reviewers и т.п.), если позже захочется ручной апрув.
    environment:
      name: production

    steps:
      - name: Deploy over SSH (запустить deploy.sh на сервере)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # deploy.sh внутри сам с `set -euo pipefail`; ssh-action@v1 всегда
          # останавливает скрипт на первой ошибке (бывший script_stop теперь
          # встроен). Любой ненулевой код — красный job.
          # install + миграции + сборка ui/landing/widget/пакетов бывает долгой.
          command_timeout: 18m
          script: |
            # bun не в PATH у non-interactive SSH (его добавляет ~/.bashrc,
            # который для неинтерактивных сессий выходит раньше). Прописываем
            # ДО запуска, чтобы и текущий on-disk deploy.sh нашёл bun на самом
            # первом деплое (дочерний процесс наследует PATH из сессии).
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            cd /opt/lead-engine
            git fetch origin
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              git stash push -m "pre-deploy dirty tracked worktree $(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git checkout main
            git pull --ff-only origin main
            # workspace job уже выполнил полный typecheck+tests. На сервере
            # оставляем миграции, production build, restart и health-check;
            # повторный workspace typecheck на малом VPS уже упирался в SSH
            # command_timeout и давал ложный красный deploy.
            DEPLOY_TYPECHECK=0 ./deploy.sh
