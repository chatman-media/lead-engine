[test]
# Coverage is opt-in via `--coverage` (or the `test:coverage` script).
# Bun 1.3.x quirks:
#   - `coverage = false` here silently overrides the CLI `--coverage` flag,
#     so we omit it entirely.
#   - `coverageThreshold` is read but never enforced (the gate is a no-op
#     as of Bun 1.3.14). Threshold enforcement runs through the
#     `scripts/check-coverage.ts` wrapper in CI instead.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Excluded from the coverage denominator: process entrypoints and test-only
# infrastructure. `index.ts` only wires `app.ts` together; `test-hooks.ts`
# exposes the `/__test/*` seed endpoints exercised by Playwright E2E, not
# unit tests. Counting them just penalises the line-coverage gate without
# a meaningful path to cover them in `bun test`.
coveragePathIgnorePatterns = ["src/index.ts", "src/test-hooks.ts"]
